name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow: tell Bing / Copilot / DuckDuckGo / Yandex (and anyone else
      # on the protocol) that URLs changed, instead of waiting to be crawled.
      # Key file lives at the site root: /<key>.txt. Non-fatal on failure.
      - name: Ping IndexNow with sitemap URLs
        if: success()
        continue-on-error: true
        env:
          SITE_HOST: blog.suubodhpatil.com
          INDEXNOW_KEY: e9fd672f7370843d8df8beebef671b7c
        run: |
          set -u
          sleep 45  # give the Pages CDN a moment to serve the fresh sitemap
          SITEMAP="$(curl -fsSL "https://${SITE_HOST}/sitemap.xml" || true)"
          if [ -z "$SITEMAP" ]; then echo "sitemap not reachable; skipping"; exit 0; fi
          # Only ping real content URLs: posts, topic hubs, about, home (skip tag/category pages).
          URLS="$(printf '%s' "$SITEMAP" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's#<loc>##' -e 's#</loc>##' \
            | grep -E "https://${SITE_HOST}/(posts/|topics/|about/|$)" \
            | sort -u)"
          COUNT="$(printf '%s\n' "$URLS" | grep -c . || true)"
          echo "Submitting ${COUNT} URLs to IndexNow"
          printf '%s\n' "$URLS" > /tmp/urls.txt
          BODY="$(python3 -c 'import json,os; u=[l.strip() for l in open("/tmp/urls.txt") if l.strip()]; h=os.environ["SITE_HOST"]; k=os.environ["INDEXNOW_KEY"]; print(json.dumps({"host":h,"key":k,"keyLocation":"https://%s/%s.txt"%(h,k),"urlList":u[:10000]}))')"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$BODY"
