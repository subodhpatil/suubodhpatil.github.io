# Tag → knowledge-graph entity map.
# Used by _includes/metadata-hook.html to emit schema.org `about` entries on
# every BlogPosting, so search engines and AI retrievers can resolve the
# standards, laws, vendors and technologies a post is about.
#
# Key   = a tag exactly as used in post front matter (lower-case).
# name  = canonical display name of the entity.
# type  = schema.org type (default: Thing).
# sameAs = authoritative URLs for the entity (official page first, then Wikipedia).
#
# Only add entries you can verify. Tags without an entry here are simply skipped.

eu-ai-act:
  name: "EU Artificial Intelligence Act (Regulation (EU) 2024/1689)"
  type: Legislation
  sameAs:
    - https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    - https://en.wikipedia.org/wiki/Artificial_Intelligence_Act

